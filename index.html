
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pergunta importante </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.97);
            width: 100%;
            max-width: 480px;
            padding: clamp(30px, 6vw, 50px) 25px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.22);
            animation: aparecer 0.7s ease;
        }

        .emoji {
            font-size: clamp(40px, 8vw, 55px);
            margin-bottom: 20px;
        }

        h1 {
            color: #292943;
            font-size: clamp(22px, 5vw, 30px);
            line-height: 1.35;
            margin-bottom: 15px;
        }

        .subtitulo {
            color: #777;
            font-size: clamp(14px, 3.5vw, 16px);
            margin-bottom: 45px;
        }

        .botoes {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 55px;
        }

        button {
            border: none;
            padding: 15px 35px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.12);
            -webkit-tap-highlight-color: transparent;
        }

        #nao {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
        }

        #nao:hover {
            transform: scale(1.07);
            box-shadow: 0 8px 20px rgba(255,65,108,0.3);
        }

        #sim {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            position: fixed;
            left: 50%;
            top: 70%;
            transform: translate(-50%, -50%);
            z-index: 100;
            white-space: nowrap;
            touch-action: none;
        }

        .resultado {
            margin-top: 25px;
            color: #764ba2;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .container {
                border-radius: 20px;
            }

            button {
                padding: 14px 30px;
                font-size: 16px;
            }
        }

        @media (max-height: 500px) {
            .container {
                padding: 20px;
            }

            .emoji {
                font-size: 30px;
                margin-bottom: 8px;
            }

            .subtitulo {
                margin-bottom: 20px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="emoji">🤔</div>

        <h1>A Thayssa votou no Lula?</h1>

        <p class="subtitulo">
            Responda com sinceridade!
        </p>

        <div class="botoes">

            <button id="nao" onclick="responder()">
                NÃO 
            </button>

        </div>

        <div class="resultado" id="resultado"></div>

    </div>

    <button id="sim">SIM </button>

    <script>

        const sim = document.getElementById("sim");

        function fugir() {

            const margem = 10;

            const maxX = window.innerWidth - sim.offsetWidth - margem;
            const maxY = window.innerHeight - sim.offsetHeight - margem;

            const x = margem + Math.random() * Math.max(0, maxX - margem);
            const y = margem + Math.random() * Math.max(0, maxY - margem);

            sim.style.left = x + "px";
            sim.style.top = y + "px";
            sim.style.transform = "none";
        }

        // Computador
        sim.addEventListener("mouseenter", fugir);

        // Celular
        sim.addEventListener("touchstart", function(e) {
            e.preventDefault();
            fugir();
        }, { passive: false });

        // Impede o clique
        sim.addEventListener("click", function(e) {
            e.preventDefault();
            fugir();
        });

        // Ajusta quando a tela muda de tamanho
        window.addEventListener("resize", fugir);

        function responder() {

            document.getElementById("resultado").innerHTML =
                "Resposta registrada! ";

        }

    </script>

</body>
</html>
